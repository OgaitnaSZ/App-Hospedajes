<h2 class="text-center mb-4" #calificaciones>Reseñas de Nuestros Clientes</h2>
<div class="container row" *ngIf="hayResenas; else noResenas">
    <div class="col-12 col-md-6 mb-4" *ngFor="let resena of resenas">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">
                    <i class="material-icons text-info" *ngFor="let star of obtenerEstrellas(resena.Calificacion)">star</i>
                </h5>
                <p class="card-text mb-4">
                {{ resena.Comentario }}
                </p>
                <footer class="blockquote-footer">{{resena.Usuario}}</footer>
            </div>
            <a [routerLink]="['/hospedaje', resena.IdHospedaje]" class="text-center text-info" *ngIf="!IdHospedaje">Ver Hospedaje</a>
        </div>
    </div>
</div>
<ng-template #noResenas>
    <p class="text-center">No hay reseñas para mostrar</p>
</ng-template>
