<main class="min-h-dvh flex flex-col justify-center items-center bg-gray-50 dark:bg-gray-900">
  <section class="w-11/12 md:w-96 bg-white dark:bg-gray-800 rounded-lg shadow-lg p-8">
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-800 dark:text-white">
      Registrarse
    </h1>

    <!-- Formulario de login -->
    <form (ngSubmit)="onRegister()" class="space-y-4">
        <div>
            <label for="nombre" class="block text-sm font-medium text-gray-700 dark:text-gray-200">
                Nombre
            </label>
            <input
                type="text"
                id="nombre"
                [(ngModel)]="nombre"
                name="nombre"
                placeholder="Tu nombre"
                required
                class="mt-1 w-full rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-2"
            />
        </div>

        <div>
            <label for="apellido" class="block text-sm font-medium text-gray-700 dark:text-gray-200">
                Apellido
            </label>
            <input
                type="text"
                id="apellido"
                [(ngModel)]="apellido"
                name="apellido"
                placeholder="Tu apellido"
                required
                class="mt-1 w-full rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-2"
            />
        </div>

        <div>
            <label for="telefono" class="block text-sm font-medium text-gray-700 dark:text-gray-200">
                Telefono
            </label>
            <input
                type="text"
                id="telefono"
                [(ngModel)]="telefono"
                name="telefono"
                placeholder="Tu telefono"
                required
                class="mt-1 w-full rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-2"
            />
        </div>

        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-200">
                Email
            </label>
            <input
                type="email"
                id="email"
                [(ngModel)]="email"
                name="email"
                placeholder="ejemplo@correo.com"
                required
                class="mt-1 w-full rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-2"
            />
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-200">
                Contraseña
            </label>
            <input
                type="password"
                id="password"
                [(ngModel)]="pass"
                name="password"
                placeholder="********"
                required
                class="mt-1 w-full rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-2"
            />
        </div>
        <button
        type="submit"
        class="w-full bg-blue-400 hover:bg-blue-500 text-white font-semibold py-2 rounded-lg transition disabled:opacity-60 disabled:cursor-not-allowed"
        [disabled]="auth.isLoading()"
        >
        {{ auth.isLoading() ? 'Cargando...' : 'Registrarse' }}
        </button>
    </form>

    <!-- Error -->
     @if(error()){
       <p class="text-red-500 text-sm mt-4 text-center">{{ error() }}</p>
     }

    <!-- Links -->
    <div class="mt-6 text-center text-sm text-gray-600 dark:text-gray-400">
      <p class="mt-2">
        ¿Ya tienes cuenta?
        <a
          routerLink="/login"
          class="text-blue-500 hover:underline font-medium"
        >
          Iniciar sesion
        </a>
      </p>
    </div>
  </section>
</main>
