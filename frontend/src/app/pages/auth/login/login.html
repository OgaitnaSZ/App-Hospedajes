<main class="min-h-3/4 flex flex-col justify-center items-center bg-gray-50 dark:bg-gray-900">
  <section class="w-11/12 md:w-96 bg-white dark:bg-gray-800 rounded-lg shadow-lg p-8">
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-800 dark:text-white">
      Iniciar Sesión
    </h1>

    <!-- Formulario de login -->
    <form [formGroup]="formLogin" (ngSubmit)="onLogin()" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-200">
          Email
        </label>
        <input
          type="email"
          id="email"
          formControlName="email"
          name="email"
          placeholder="ejemplo@correo.com"
          required
          class="mt-1 w-full rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-2"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-200">
          Contraseña
        </label>
        <input
          type="password"
          id="password"
          formControlName="password"
          name="password"
          placeholder="********"
          required
          class="mt-1 w-full rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-2"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-400 hover:bg-blue-500 text-white font-semibold py-2 rounded-lg transition disabled:opacity-60 disabled:cursor-not-allowed"
        [disabled]="loading()"
      >
        {{ loading() ? 'Cargando...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <!-- Error -->
     @if(error()){
       <p class="text-red-500 text-sm mt-4 text-center">{{ error() }}</p>
     }

    <!-- Recuperar contraseña -->
     @if(recuperar()){
       <div class="mt-8 border-t border-gray-300 dark:border-gray-700 pt-6">
         <h2 class="text-lg font-semibold mb-2 text-gray-800 dark:text-white">
           Recuperar Contraseña
         </h2>
         <form [formGroup]="formRec" (ngSubmit)="recuperarPassword()" class="space-y-3">
           <div>
             <label for="emailRec" class="block text-sm font-medium text-gray-700 dark:text-gray-200">
               Email
             </label>
             <input
               type="email"
               id="emailRec"
               formControlName="emailRec"
               name="emailRec"
               required
               class="mt-1 w-full rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-2"
             />
           </div>
           <button
             type="submit"
             class="w-full bg-blue-400 hover:bg-blue-500 text-white font-semibold py-2 rounded-lg transition disabled:opacity-60 disabled:cursor-not-allowed"
             [disabled]="loading()"
           >
             Recuperar Contraseña
           </button>
         </form>
       </div>
     }

    <!-- Links -->
    <div class="mt-6 text-center text-sm text-gray-600 dark:text-gray-400">
      <p>
        ¿Olvidaste tu contraseña?
        <a
          [routerLink]="['/login']"
          [queryParams]="{ recuperar: 'si' }"
          class="text-blue-500 hover:underline font-medium"
        >
          Recuperar contraseña
        </a>
      </p>
      <p class="mt-2">
        ¿No tienes cuenta?
        <a
          routerLink="/registro"
          class="text-blue-500 hover:underline font-medium"
        >
          Crear cuenta
        </a>
      </p>
    </div>
  </section>
</main>
