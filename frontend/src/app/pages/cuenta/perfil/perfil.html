<h1 class="text-gray-800 text-3xl font-bold mb-6">Mi Perfil</h1>

<div class="flex flex-col lg:flex-row gap-10">
    <!-- Formulario de Actualización de Datos -->
    <form [formGroup]="formData" (submit)="guardarDatos()" class="w-full lg:w-1/2 mx-auto bg-white p-6 rounded-lg shadow space-y-6">
        <h2 class="text-xl font-bold flex items-center gap-2 text-gray-800">
        <span class="material-symbols-outlined text-blue-500">account_circle</span>
        Actualizar Datos
        </h2>

        <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
            <input name="nombre" type="text" formControlName="nombre"
                class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Apellido</label>
            <input name="apellido" type="text" formControlName="apellido"
                class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="mb-3">
            <label class="block text-sm font-medium text-gray-700 mb-1">Telefono</label>
                <input name="telefono" type="text" formControlName="telefono"
                    class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="mb-3">
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input name="email" type="text" formControlName="email"
                    class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="mb-3">
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input name="password" type="password" formControlName="password"
                    class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <button type="submit"
        class="w-full bg-blue-500 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition-colors duration-200">
        Guardar Cambios
        </button>
    </form>

    <!-- Formulario de Contraseña -->
    <form [formGroup]="formPassword" (submit)="guardarPassword()" class="w-full lg:w-1/2 mx-auto bg-white p-6 rounded-lg shadow space-y-6">
        <h2 class="text-xl font-bold flex items-center gap-2 text-gray-800">
        <span class="material-symbols-outlined text-red-400">lock</span>
        Cambiar Contraseña
        </h2>

        <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña Actual</label>
        <input  name="password" type="password" formControlName="password"
            class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Nueva Contraseña</label>
        <input  name="newPassword" type="password" formControlName="newPassword"
            class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar Nueva Contraseña</label>
        <input  name="newPasswordConfirm" type="password" formControlName="newPasswordConfirm"
            class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <button type="submit"
        class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded-lg transition-colors duration-200">
        Cambiar Contraseña
        </button>
    </form>
</div>
