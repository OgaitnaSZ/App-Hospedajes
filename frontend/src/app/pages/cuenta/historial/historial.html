<h2 class="text-gray-800 text-3xl font-bold mb-6">Historial</h2>

<!-- Tabs -->
<div class="flex border-b border-gray-300 mb-4">
  <button
    class="px-4 py-2 font-medium transition"
    [ngClass]="activeTab === 'hospedajes' 
      ? 'text-blue-600 border-b-2 border-blue-600' 
      : 'text-gray-600 hover:text-blue-600'"
    (click)="activeTab = 'hospedajes'">
    Hospedajes
  </button>

  <button
    class="px-4 py-2 font-medium transition"
    [ngClass]="activeTab === 'actividades' 
      ? 'text-blue-600 border-b-2 border-blue-600' 
      : 'text-gray-600 hover:text-blue-600'"
    (click)="activeTab = 'actividades'">
    Actividades
  </button>
</div>


<div>
  @if(activeTab === 'hospedajes'){
    <app-reservas-hospedaje
      [idUsuario]="usuario?.idUsuario"
    ></app-reservas-hospedaje>
  }

  @if(activeTab === 'actividades'){
    <app-reservas-actividad 
      [idUsuario]="usuario?.idUsuario"
    ></app-reservas-actividad>
  }
</div>
