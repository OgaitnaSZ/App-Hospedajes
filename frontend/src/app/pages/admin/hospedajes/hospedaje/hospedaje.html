<a routerLink="/administrador/hospedajes" 
   class="group flex items-center font-semibold mb-4">
  <span class="material-symbols-outlined mr-1 transition-transform duration-300 ease-in-out group-hover:translate-x-[-4px]">
    arrow_back
  </span>
  Volver
</a>

<h2 class="text-gray-800 text-3xl font-bold mb-6">{{ titulo }} {{hospedaje()?.titulo}}</h2>

<!-- Tabs -->
<div class="flex border-b border-gray-300 mb-4">
  <button
    class="px-4 py-2 font-medium transition"
    [ngClass]="activeTab === 'form' 
      ? 'text-blue-600 border-b-2 border-blue-600' 
      : 'text-gray-600 hover:text-blue-600'"
    (click)="activeTab = 'form'">
    Detalles
  </button>

  <button
    class="px-4 py-2 font-medium transition flex items-center gap-1"
    [disabled]="!idHospedaje"
    [ngClass]="[
      activeTab === 'habitaciones'
        ? 'text-blue-600 border-b-2 border-blue-600'
        : !idHospedaje
          ? 'text-gray-400 cursor-not-allowed'
          : 'text-gray-600 hover:text-blue-600'
    ]"
    (click)="idHospedaje && (activeTab = 'habitaciones')">
    Habitaciones ({{hospedaje()?.habitaciones?.length ?? 0}})
    @if(idHospedaje == ''){<span class="material-symbols-outlined text-sm">lock</span>}
  </button>

  <button
    class="px-4 py-2 font-medium transition flex items-center gap-1"
    [disabled]="!idHospedaje"
    [ngClass]="[
      activeTab === 'fotos'
        ? 'text-blue-600 border-b-2 border-blue-600'
        : !idHospedaje
          ? 'text-gray-400 cursor-not-allowed'
          : 'text-gray-600 hover:text-blue-600'
    ]"
    (click)="idHospedaje && (activeTab = 'fotos')">
    Fotos ({{hospedaje()?.fotos?.length ?? 0}}/10)
    @if(idHospedaje == ''){<span class="material-symbols-outlined text-sm">lock</span>}
  </button>

  <button
    (click)="toggleEstado()"
    name="estado"
    class="px-4 py-2 font-medium flex items-center gap-1 transition-all duration-200"
    [ngClass]="
    hospedaje()?.estado === 'activo'
        ? 'bg-green-100 text-green-700 hover:bg-green-200'
        : 'bg-gray-200 text-gray-600 hover:bg-gray-300'
    "
    >
    <span class="material-symbols-outlined text-lg">
    {{ hospedaje()?.estado === 'activo' ? 'toggle_on' : 'toggle_off' }}
    </span>
    <span class="text-sm font-medium">
    {{ hospedaje()?.estado === 'activo' ? 'Activo' : 'Desactivado' }}
    </span>
  </button>

</div>

<div>
  @if(activeTab === 'form'){
    <app-formulario
      [hospedajeDetalles]="hospedaje()"
    ></app-formulario>
  }

  @if(activeTab === 'habitaciones'){
    <app-habitaciones 
      [habitacionesHospedaje]="hospedaje()?.habitaciones"
      [idHospedaje]="hospedaje()?.idHospedaje"
    ></app-habitaciones>
  }

  @if(activeTab === 'fotos'){
    <app-fotos
      [fotosHospedaje]="hospedaje()?.fotos"
      [idHospedaje]="hospedaje()?.idHospedaje"
    ></app-fotos>
  }
</div>
