<div class="flex flex-row gap-4">
  <div class="w-1/2">
    <h2 class="text-gray-800 text-3xl font-bold mb-6">{{ titulo }}</h2>
    <form [formGroup]="form" (submit)="agregarHospedaje()" class="mx-auto bg-white p-6 rounded-lg shadow space-y-4">
      <!-- Título -->
      <div>
        <label for="titulo" class="block text-sm font-medium text-gray-700">Título</label>
        <input type="text" id="titulo" formControlName="titulo"
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          required>
      </div>
    
      <!-- Descripción -->
      <div>
        <label for="descripcion" class="block text-sm font-medium text-gray-700">Descripción</label>
        <input type="text" id="descripcion" formControlName="descripcion"
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          required>
      </div>
    
      <!-- Ciudad -->
      <div>
        <label for="ciudad" class="block text-sm font-medium text-gray-700">Ciudad</label>
        <select id="ciudad" formControlName="ciudad"
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          required>
          <option value="termas">Termas de Río Hondo (SDE)</option>
          <option value="salta">Salta</option>
          <option value="tucuman">Tucumán</option>
          <option value="jujuy">Jujuy</option>
        </select>
      </div>
    
      <!-- Estrellas -->
      <div>
        <label for="estrellas" class="block text-sm font-medium text-gray-700">Estrellas</label>
        <input type="number" id="estrellas" max="5" min="1" formControlName="estrellas"
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          required>
      </div>
    
      <!-- Dirección -->
      <div>
        <label for="direccion" class="block text-sm font-medium text-gray-700">Dirección</label>
        <input type="text" id="direccion" formControlName="direccion"
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          required>
      </div>
    
      <!-- Teléfono -->
      <div>
        <label for="telefono" class="block text-sm font-medium text-gray-700">Teléfono</label>
        <input type="text" id="telefono" formControlName="telefono"
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          required>
      </div>
    
      <!-- Coordenadas -->
      <div>
        <label for="coordenadas" class="block text-sm font-medium text-gray-700">Coordenadas</label>
        <input type="text" id="coordenadas" formControlName="coordenadas"
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          required>
      </div>
    
      <!-- Servicios con acordeón -->
      <div class="border rounded-lg">
        <button type="button"
          (click)="mostrarServicios = !mostrarServicios"
          class="w-full flex justify-between items-center px-4 py-2 text-left font-medium text-gray-800 bg-gray-100 hover:bg-gray-200 rounded-t-lg">
          <span>Servicios</span>
          <svg [class.rotate-180]="mostrarServicios"
            class="h-5 w-5 transform transition-transform duration-200"
            fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
    
        @if(mostrarServicios){
          <div class="p-4 border-t bg-white rounded-b-lg">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
              @for(servicio of servicios(); track $index){
                <label class="flex items-center space-x-2 p-2 border rounded-lg cursor-pointer hover:bg-gray-50">
                  <input
                    type="checkbox"
                    class="h-4 w-4 text-blue-600 border-gray-300 rounded"
                    [value]="servicio.idServicio"
                    (change)="almacenarServicios($event)"
                    [checked]="isServicioSeleccionado(servicio.idServicio)"
                    name="servicios">
                  <span class="text-gray-700 text-sm">{{ servicio.nombre }}</span>
                </label>
              }
            </div>
          </div>
        }
      </div>
    
      <!-- Error -->
      @if(error()){
        <p class="text-red-500 text-sm mt-2">{{ error() }}</p>
      }
    
      <!-- Botón Toggle Estado Hospedaje -->
       <div>
        <label for="estado" class="block text-sm font-medium text-gray-700">Estado</label>
        <button
          (click)="toggleEstado()"
          name="estado"
          class="flex items-center gap-2 px-4 py-2 rounded-full transition-all duration-200"
          [ngClass]="
            hospedaje()?.estado === 'activo'
              ? 'bg-green-100 text-green-700 hover:bg-green-200'
              : 'bg-gray-200 text-gray-600 hover:bg-gray-300'
          "
        >
          <span class="material-symbols-outlined text-lg">
            {{ hospedaje()?.estado === 'activo' ? 'toggle_on' : 'toggle_off' }}
          </span>
          <span class="text-sm font-medium">
            {{ hospedaje()?.estado === 'activo' ? 'Activo' : 'Desactivado' }}
          </span>
        </button>
      </div>

      <!-- Botón -->
      <button type="submit"
        class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition">
        {{ titulo }}
      </button>
    </form>
  </div>

  <div class="w-1/2">
    @if(idHospedaje !== ''){
      <app-fotos [idHospedaje]="idHospedaje"></app-fotos>
    }
  </div>
</div>
  @if(idHospedaje !== ''){
    <app-habitaciones [idHospedaje]="idHospedaje" class="p-4"></app-habitaciones>
  }
