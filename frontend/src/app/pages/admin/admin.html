<main class="container mx-auto flex flex-col md:flex-row min-h-8/12">
@if(isAdmin()){
    <aside class="w-full md:w-1/4 p-4">
        <div class="flex flex-col space-y-4" id="v-pills-tab" role="tablist" aria-orientation="vertical">
            <a class="nav-link text-gray-800 hover:text-blue-600" routerLink="/administrador/hospedajes" routerLinkActive="active">Administrar Hospedajes</a>
            <a class="nav-link text-gray-800 hover:text-blue-600" routerLink="/administrador/actividades" routerLinkActive="active">Administrar Actividades</a>
            <a class="nav-link text-gray-800 hover:text-blue-600" routerLinkActive="active">Pagos</a>
            <a class="nav-link text-gray-800 hover:text-blue-600" routerLink="/administrador/perfil" routerLinkActive="active">Mi Perfil</a>
            <a class="nav-link text-gray-800 hover:text-blue-600" routerLink="/administrador/cambiar-contrasena" routerLinkActive="active">Cambiar Contraseña</a>
            <a class="nav-link text-gray-800 hover:text-blue-600 cursor-pointer" (click)="cerrarSesion()" routerLinkActive="active">Cerrar Sesión</a>
        </div>
    </aside>
    <router-outlet class="flex-1 p-4"></router-outlet>
}@else{
    <p class="text-red-600 font-semibold">No tienes permiso para estar aquí</p>
}
</main>
