@if(hayResenas()) {
  <div class="flex flex-wrap -mx-4">
    @for (resena of resenas(); track resenas()) {
      <div class="w-full md:w-1/3 px-4 mb-6">
        <div class="bg-white rounded shadow">
          <div class="p-4">
            <h5 class="text-lg font-semibold mb-2">
                @for (star of utilsService.obtenerEstrellas(resena.calificacion) ; track $index){
                    <i class="material-icons text-blue-500">star</i>
                }
            </h5>
            <p class="text-gray-700 mb-4">
              {{ resena.comentario }}
            </p>
            <footer class="text-sm text-gray-500">— {{ resena.usuario }}</footer>
          </div>
          @if (!idHospedaje) {
            <a [routerLink]="['/hospedaje', resena.idHospedaje]" class="block text-center text-blue-500 py-2 hover:underline">
              Ver Hospedaje
            </a>
          }
        </div>
      </div>
    }
  </div>
} @else {
  <p class="text-gray-400 text-center">No hay reseñas para mostrar</p>
}
