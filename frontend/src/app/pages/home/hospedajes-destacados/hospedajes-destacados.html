@if(hayHospedajes()){
  <div class="flex flex-wrap -mx-2">
    @for(h of hospedajesCargados(); track hospedajesCargados()){
      <a
        [routerLink]="['/hospedaje', h.idHospedaje]"
        class="w-full md:w-1/3 px-2 mb-4"
      >
        <div class="bg-white rounded shadow overflow-hidden hover:shadow-lg transition-shadow duration-300">
          <img
            [src]="h.imagen"
            alt="{{ h.titulo }}"
            class="w-full object-cover"
            style="height: 28vh;"
          />
          <div class="p-4">
            <p class="bg-blue-500 text-white rounded font-semibold text-sm w-fit px-2 py-1 mb-2">
              Oferta
            </p>
            <h5 class="text-lg font-semibold">{{ h.titulo }}</h5>
            <p class="text-sm text-gray-500 mb-2">{{ h.ciudad }}</p>
            <p class="text-sm text-gray-700 mb-4">
              {{ h.descripcion | slice:0:128 }}...
            </p>
            <div class="flex justify-end items-baseline">
              <p class="text-sm text-gray-500 mr-2">Desde</p>
              <p class="text-3xl font-bold text-gray-800">
                ${{ h.precioMinimo | number:'1.0-0' }}
              </p>
            </div>
          </div>
        </div>
      </a>
    }
  </div>
} @else{
  <p class="text-gray-400 text-center">No hay hospedajes destacados</p>
}
