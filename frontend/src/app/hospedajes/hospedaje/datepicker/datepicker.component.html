<div class="datepicker-container">
    <!-- Header con título y acciones -->
    <div class="datepicker-header">
      <button type="button" (click)="prevMonth($event)">Anterior</button>
      <h3>{{ getMonthName(currentDate) }} {{ currentDate.getFullYear() }}</h3>
      <button type="button" (click)="nextMonth($event)">Siguiente</button>
    </div>
    
  
    <!-- Mensaje guía -->
    <div class="datepicker-message">
      <p>{{ message }}</p>
    </div>
  
    <!-- Calendario -->
    <div class="calendar">
      <div
        *ngFor="let day of days; let i = index"
        class="col-1"
        [ngClass]="{
          'excluded': isExcluded(day),
          'range-hovered': isHovered(day) && !isExcluded(day),
          'selected': isSelected(day)
        }"
        (click)="selectDate(day)"
        (mouseenter)="onMouseEnter(day)"
        (mouseleave)="onMouseLeave()"
      >
        {{ day | date: 'dd' }}
      </div>
    </div>
    
  
    <!-- Mostrar fechas seleccionadas -->
    <div *ngIf="startDate && endDate">
      <p>Fecha de Inicio: {{ startDate | date: 'longDate' }}</p>
      <p>Fecha de Salida: {{ endDate | date: 'longDate' }}</p>
    </div>
  </div>
