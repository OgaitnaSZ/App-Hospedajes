<form (submit)="agregarHospedaje()" enctype="multipart/form-data">
    <div class="form-group">
        <label for="titulo">Titulo</label>
        <input type="text" id="titulo" class="form-control" [(ngModel)]="nuevoHospedaje.Titulo" name="titulo" required>
    </div>
    <div class="form-group">
        <label for="descripcion">Descripcion</label>
        <input type="text" id="descripcion" class="form-control" [(ngModel)]="nuevoHospedaje.Descripcion" name="descripcion" required>
    </div>
    <div class="form-group">
        <label for="ciudad">Ciudad</label>
        <select class="form-select" [(ngModel)]="nuevoHospedaje.Ciudad" name="ciudad" required>
          <option value="termas">Termas de Río Hondo (SDE)</option>
          <option value="salta">Salta</option>
          <option value="tucuman">Tucumán</option>
          <option value="jujuy">Jujuy</option>
        </select>
    </div>
    <div class="form-group">
        <label for="direccion">Direccion</label>
        <input type="text" id="direccion" class="form-control" [(ngModel)]="nuevoHospedaje.Direccion" name="direccion" required>
    </div>
    <div class="form-group">
        <label for="telefono">Telefono</label>
        <input type="text" id="Telefono" class="form-control" [(ngModel)]="nuevoHospedaje.Telefono" name="telefono" required>
    </div>
    <div class="form-group">
      <label for="Coordenadas">Coordenadas</label>
      <input type="text" id="Coordenadas" class="form-control" [(ngModel)]="nuevoHospedaje.Coordenadas" name="Coordenadas" required>
    </div>
    <div class="form-group">
      <label for="Servicios">Servicios</label>
      <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3">
        <div class="col" *ngFor="let servicio of servicios">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              [value]="servicio.IdServicio"
              (change)="almacenarServicios($event)" 
              name="servicios">
            <label class="form-check-label">
              {{ servicio.Nombre }}
            </label>
          </div>
        </div>
      </div>
    </div>    
    <div class="form-group mt-3">
        <label for="fotos">Fotos</label>
        <input type="file" (change)="onFileChange($event)" multiple accept="image/*">
    </div>
    <p *ngIf="imagenError" class="text-danger mt-3">
      {{ imagenError }}
    </p>
    <button type="submit" class="btn btn-primary my-3">Agregar Hospedaje</button>
</form>
