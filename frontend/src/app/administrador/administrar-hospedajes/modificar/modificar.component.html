<div class="d-flex flex-column flex-md-row">
    <div class="col-12 col-md-4">
        <h2>Datos:</h2>
        <form (submit)="modificarHospedaje()" enctype="multipart/form-data">
            <div class="form-group">
                <label for="titulo">Titulo</label>
                <input type="text" id="titulo" class="form-control" [(ngModel)]="hospedaje.Titulo" name="titulo" required>
            </div>
            <div class="form-group">
                <label for="descripcion">Descripcion</label>
                <input type="text" id="descripcion" class="form-control" [(ngModel)]="hospedaje.Descripcion" name="descripcion" required>
            </div>
            <div class="form-group">
              <label for="ciudad">Ciudad</label>
              <select class="form-select" [(ngModel)]="hospedaje.Ciudad" name="ciudad" required>
                <option value="termas">Termas de Río Hondo (SDE)</option>
                <option value="salta">Salta</option>
                <option value="tucuman">Tucumán</option>
                <option value="jujuy">Jujuy</option>
              </select>
            </div>
            <div class="form-group">
                <label for="direccion">Direccion</label>
                <input type="text" id="direccion" class="form-control" [(ngModel)]="hospedaje.Direccion" name="direccion" required>
            </div>
            <div class="form-group">
              <label for="telefono">Telefono</label>
              <input type="text" id="Telefono" class="form-control" [(ngModel)]="hospedaje.Telefono" name="telefono" required>
            </div>
            <div class="form-group">
                <label for="Coordenadas">Coordenadas</label>
                <input type="text" id="Coordenadas" class="form-control" [(ngModel)]="hospedaje.Coordenadas" name="Coordenadas" required>
            </div>
          <div class="form-group">
              <label for="Servicios">Servicios</label>
              <div *ngFor="let servicio of servicios">
                <div class="form-check">
                    <input 
                        class="form-check-input" 
                        type="checkbox" 
                        value="{{servicio.IdServicio}}"
                        [checked]="servicioSeleccionado(servicio.IdServicio)" 
                        (change)="almacenarServicios($event)">
                    <label class="form-check-label">
                        {{ servicio.Nombre }}
                    </label>
                </div>
              </div>            
          </div>
            <input type="hidden" id="IdHospedaje" class="form-control" [(ngModel)]="hospedaje.IdHospedaje" name="IdHospedaje" required>
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </form>
        <p class="text-danger">{{ mensaje }}</p>
    </div>

    <div class="ms-md-5 col-12 col-md-8">
      <app-fotos [IdHospedaje]="idHospedaje"></app-fotos>
      <app-habitaciones [IdHospedaje]="idHospedaje"></app-habitaciones>
    </div>
</div>
