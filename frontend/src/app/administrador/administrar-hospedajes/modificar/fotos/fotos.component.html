<h2>Fotos:</h2>
<!-- Visualización de imágenes existentes -->
<div class="row" *ngIf="imagenesUrl.length>0">
    <div class="col-md-3" *ngFor="let imagen of imagenesUrl; let i = index">
    <div class="card">
        <img src="/assets/uploads/hospedajes/{{imagen.Name}}" class="card-img-top" alt="Imagen {{ i + 1 }}">
        <div class="card-body text-center">
        <!-- Botón para marcar como principal -->
        <button 
            class="btn btn-outline-primary btn-sm mb-2" 
            [class.active]="imagenPrincipal === imagen.IdFoto" 
            (click)="seleccionarImagenPrincipal(imagen.IdFoto, imagen.Name)">
            Marcar como principal
        </button>
        <!-- Botón para eliminar -->
        <button 
            class="btn btn-outline-danger btn-sm" 
            (click)="eliminarFoto(imagen.IdFoto)">
            Eliminar
        </button>
        </div>
    </div>
    </div>
</div>
<!-- Subida de nuevas fotos -->
<div class="mt-3 text-center">
    <label for="upload-input" class="btn btn-primary">
    Agregar Fotos
    </label>
    <input 
    id="upload-input" 
    type="file" 
    accept="image/*" 
    multiple 
    (change)="agregarFotos($event)" 
    class="d-none" 
    />
</div>
