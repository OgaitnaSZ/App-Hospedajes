<a routerLink='/administrador/agregar-hospedaje' class="btn btn-primary w-auto">Agregar Hospedaje</a>
<p class="text-info">{{ mensaje }}</p>
<section class="container table-responsive">
    <table class="table">
        <thead class="thead-dark">
          <tr>
            <th scope="col" class="col-2">Foto</th>
            <th scope="col">Titulo</th>
            <th scope="col">Descripcion</th>
            <th scope="col">Telefono</th>
            <th scope="col">Ciudad</th>
            <th scope="col">Direccion</th>
            <th scope="col">Editar</th>
            <th scope="col">Eliminar</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let hospedaje of hospedajes">
            <th scope="row">        
                <figure>
                    <img src="assets/uploads/hospedajes/{{ hospedaje.Imagen }}" class="img-fluid h-100">
                </figure>
            </th>
            <td scope="row">{{ hospedaje.Titulo }}</td>
            <td scope="row">{{ getTextoCorto(hospedaje.Descripcion) }}</td>
            <td scope="row">{{ hospedaje.Telefono }}</td>
            <td scope="row">{{ hospedaje.Ciudad }}</td>
            <td scope="row">{{ hospedaje.Direccion }}</td>
            <td scope="row"><a [routerLink]="['/administrador/editar', hospedaje.IdHospedaje]"><span class="material-symbols-outlined" >edit</span></a></td>
            <td scope="row"><span class="material-symbols-outlined" (click)="eliminar(hospedaje.IdHospedaje)">delete</span></td>
          </tr>
        </tbody>
      </table>
</section>
